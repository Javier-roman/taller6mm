# CI v1 de Taller6mm (plan de la Fase 0, S2; docs/08 §3).
# - Permisos mínimos: nada a nivel de workflow y `contents: read` por job.
# - Solo acciones de GitHub (`actions/*`), fijadas por SHA: el repo solo admite acciones de GitHub y de
#   creadores verificados, con SHA obligatorio. Las herramientas se instalan con versión exacta y, los
#   binarios descargados, con su SHA-256 comprobado.
# - Sin `pull_request_target`, sin secretos y sin cachés compartidas entre PR y `main`.
# - El despliegue de preview, los e2e contra la preview y Lighthouse llegan en S3 y S5.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 12.16.1
  UV_VERSION: 0.11.32
  TURBO_TELEMETRY_DISABLED: "1"
  ASTRO_TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"
  DO_NOT_TRACK: "1"

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Javi desarrolla en Windows: el mismo verify tiene que pasar allí.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: pnpm y uv (versiones exactas)
        run: |
          npm install --global pnpm@${{ env.PNPM_VERSION }}
          python -m pip install --disable-pip-version-check uv==${{ env.UV_VERSION }}
      - name: Instalar dependencias (lockfile congelado)
        run: pnpm install --frozen-lockfile
      - name: verify (lint, typecheck, tests, build y tests de .claude)
        run: pnpm verify
      - name: Presupuestos de tamaño
        run: pnpm size

  e2e:
    name: e2e (Playwright + axe)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      - name: Navegador de Playwright
        run: pnpm --filter @taller6mm/web exec playwright install --with-deps chromium
      - name: e2e contra la build en workerd con D1 local
        run: pnpm e2e
      - name: Informe de Playwright
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  secretos:
    name: secretos (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # SHA-256 de gitleaks_8.30.1_linux_x64.tar.gz (checksums oficiales de la release).
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Descargar gitleaks y comprobar su checksum
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
      - name: Escanear todo el historial
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .'

  dependencias:
    name: dependencias (OSV y pnpm audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    env:
      OSV_VERSION: 2.7.0
      # SHA-256 de osv-scanner_linux_amd64 v2.7.0 (osv-scanner_SHA256SUMS de la release).
      OSV_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Descargar OSV-Scanner y comprobar su checksum
        run: |
          curl -sSfL -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum --check --strict -
          chmod +x "$RUNNER_TEMP/osv-scanner"
      - name: OSV-Scanner (pnpm-lock.yaml y uv.lock)
        run: '"$RUNNER_TEMP/osv-scanner" scan source --lockfile pnpm-lock.yaml --lockfile apps/pipeline/uv.lock'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@${{ env.PNPM_VERSION }}
      - name: pnpm audit (dependencias de producción, altas y críticas)
        run: pnpm audit --prod --audit-level high

  sast:
    name: SAST (Semgrep CE)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Semgrep (versión exacta)
        run: python -m pip install --disable-pip-version-check semgrep==1.182.1
      # Las tres reglas excluidas piden 7 días de espera en pnpm, uv y Renovate. La política aprobada
      # es de 3 días (plan de la Fase 0, decisión 4) y la hace cumplir scripts/supply-chain.test.mjs.
      - name: Semgrep (reglas por defecto, sin métricas)
        run: >-
          semgrep scan --config p/default --error --metrics off
          --exclude node_modules --exclude dist
          --exclude-rule package_managers.pnpm.pnpm-missing-minimum-release-age.pnpm-minimum-release-age
          --exclude-rule package_managers.uv.uv-missing-dependency-cooldown.uv-missing-dependency-cooldown
          --exclude-rule package_managers.renovate.renovate-missing-minimum-release-age.renovate-missing-minimum-release-age
