packages:
  - apps/*
  - packages/*

# ── Cadena de suministro (plan de la Fase 0, decisión 4) ─────────────────────
# Nada con menos de 3 días publicado (frena paquetes comprometidos recién subidos), sin perder
# la procedencia firmada de una versión a otra, sin scripts de instalación salvo la lista
# blanca y sin dependencias «exóticas» (git, tarballs) en las subdependencias.
minimumReleaseAge: 4320
minimumReleaseAgeStrict: true
trustPolicy: no-downgrade
strictDepBuilds: true
blockExoticSubdeps: true
engineStrict: true
allowBuilds:
  # Binarios nativos verificados por el propio paquete.
  esbuild: true
  workerd: true
  # lefthook instala los hooks desde el script `prepare` de la raíz (código nuestro), no desde el suyo.
  lefthook: false
  # Astro lo ofrece para optimizar imágenes en Node; en Workers usamos el modo `compile`.
  sharp: false

# ── Catálogo: una sola versión de cada dependencia en todo el monorepo ──────
# Versiones exactas; Renovate las actualiza respetando la edad mínima (renovate.json).
catalog:
  # Web
  astro: 7.4.3
  "@astrojs/cloudflare": 14.4.3
  "@astrojs/react": 7.1.2
  "@astrojs/check": 0.9.12
  react: 19.3.1
  react-dom: 19.3.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  # Cloudflare y servidor
  wrangler: 4.154.0
  hono: 4.13.14
  # Datos
  drizzle-orm: 0.45.4
  drizzle-kit: 0.31.11
  zod: 4.6.7
  # Calidad
  typescript: 6.0.3
  "@types/node": 26.6.5
  "@biomejs/biome": 2.6.3
  turbo: 2.11.10
  # 2.2.2 se publicó a mano y sin procedencia firmada (las anteriores, desde GitHub Actions con
  # procedencia SLSA): `trustPolicy: no-downgrade` la bloquea. Nos quedamos en 2.2.1.
  lefthook: 2.2.1
  vitest: 4.1.12
  # 0.23.0 se publicó sin procedencia firmada (0.22.0 sí la tiene): trustPolicy la bloquea.
  "@cloudflare/vitest-pool-workers": 0.22.0
  fast-check: 4.10.2
  "@playwright/test": 1.64.1
  # MCP de Playwright para Claude Code (.claude/mcp/playwright.mjs). Debe coincidir con MCP_PACKAGE
  # del lanzador; un test y Renovate (customManagers) los mantienen alineados.
  "@playwright/mcp": 0.0.83
  "@axe-core/playwright": 4.14.0
  size-limit: 14.3.0
  "@size-limit/file": 14.3.0
